<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>Xemu MEGA65 emulation</title>
	<style>
		body {
			margin: 10;
			background: lightblue;
			text: white;
			/* display: flex; */
			justify-content: center;
			align-items: center;
			height: 100vh;
		}
		canvas {
			background-color: black;
			width: 705px;
			height: 576px;
			border: 1px black solid;
		}
		#console-container {
			background: #1e1e1e;
			color: #d4d4d4;
			padding: 10px;
			height: 200px;
			overflow-y: auto;
			font-family: 'Courier New', monospace;
			font-size: 12px;
			border: 1px solid #444;
		}
		#console {
			margin: 0;
			white-space: pre-wrap;
		}
		button {
			padding: 10px;
			background: #444;
			color: white;
			cursor: pointer;
		}
		button:hover {
			background: blue;
		}
		details>summary {
			background: #444;
			color: white;
			padding: 10px;
			cursor: pointer;
		}
		details>summary:hover {
			background: blue;
		}
		#version-info {
			border: 1px black solid;
			float: right;
			background: #444;
			color: white;
			padding: 10px;
		}
	</style>
</head>
<body>
	<button onclick="msg_gate(1)">FULL&nbsp;RESET</button>
	<button onclick="msg_gate(2)">CPU&nbsp;RESET</button>
	<button onclick="msg_gate(3)">FULLSCREEN</button>
	<button onclick="msg_gate(4)">MATRIX</button>
	<button onclick="write_file('', 'Ez egy file')">WRITE&nbsp;FILE</button>
	<span id="version-info">XEMU::MEGA65</span>
	<br>

	<div id="emulator-wrapper" style="max-width: 705px; margin: auto; position: relative;">
		<div id="canvas-container" style="position: relative; width: 705px; height: 576px; background: black;">
			<div id="loading-overlay" style="
				position: absolute; top: 0; left: 0; width: 100%; height: 100%;
				background-color: rgba(0,0,0,0.9);
				display: flex; flex-direction: column; justify-content: center; align-items: center;
				color: #00ff00; font-family: monospace; z-index: 10;
			">
				<img src="shell.gif" alt="Loading in progress" style="width: 64px; height: 64px; margin-bottom: 20px;">
				<div id="loading-text">LOADING EMULATOR</div>
			</div>
			<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5;"></canvas>
		</div>
	</div>



	<br>
	<details open>
		<summary>Emulator stdout (click to open/close)</summary>
		<div id="console-container">
			<pre id="console"></pre>
		</div>
	</details>
	<script type="text/javascript">
		var msg_gate_wrap = false;
		function msg_gate ( id ) {
			emulator_output("[SHELL] submitting gate message " + id);
			return msg_gate_wrap ? msg_gate_wrap(id) : -1;
		}
		var con = document.getElementById("console");
		var container = document.getElementById("console-container");
		var overlay = document.getElementById("loading-overlay");
		var loadingText = document.getElementById("loading-text");
		var versionInfo = document.getElementById("version-info");
		var mount_phase = 0;
		function emulator_output ( text ) {
			if (text) {
				var node = document.createTextNode(text + "\n");
				con.appendChild(node);
				container.scrollTop = container.scrollHeight;
				if (con.childNodes.length > 256)
					con.removeChild(con.firstChild);
				if (versionInfo && text.startsWith("VERSION: ")) {
					let s = text.split(" ");
					emulator_output("[SHELL] Version string identified: " + s.slice(1).join(" "));
					versionInfo.innerHTML += " <i>" + s.at(-2) + "/" + s.at(-4) + "</i>";
					versionInfo = false;
				}
			}
		}
		function write_file ( fn, data ) {
			if (!msg_gate_wrap)
				return;
			const encoder = new TextEncoder();
			const encoded_data = encoder.encode(data);
			fno = fn.toUpperCase();
			let msg_id = -1;
			if (fno == "") {
				fno = "MOUNT" + mount_phase + ".D81";
				msg_id = mount_phase;
				mount_phase ^= 1;
			}
			fn = "/files/hdos/" + fno
			emulator_output("[SHELL] writing file (" + encoded_data.length + " bytes) to " + fn);
			Module.FS.writeFile(fn, encoded_data);
			if (msg_id >= 0)
				msg_gate(5 + msg_id);
		}
		emulator_output("[SHELL] Origin: " + document.URL);
		emulator_output("[SHELL] Shell is online @ " + navigator.userAgent);
		var Module = {
			arguments: "-fastboot -besure -sdlrenderquality 2 -gui none -hdosvirt".split(" "),
			canvas: (function () {
				emulator_output("[SHELL] Canvas grabbing");
				return document.getElementById("canvas");
			})(),
			setStatus: function ( text ) {
				if (loadingText) {
					loadingText.textContent = text ? text : "Loading";
					emulator_output("[SHELL] Loading progress: \"" + loadingText.textContent + "\"");
				}
			},
			print: function ( text ) {
				emulator_output(text);
			},
			printErr: function ( text ) {
				emulator_output("STDERR: " + text);
			},
			onRuntimeInitialized: function () {
				emulator_output("[SHELL] onRuntimeInitialized");
				msg_gate_wrap = Module.cwrap("msg_gate", "number", ["number"]);
				overlay.style.display = "none";
			},
			preRun: [function () {
				emulator_output("[SHELL] PRERUN: Starting emulator with command line: " + Module.arguments.join(" "));
			},],
		};
	</script>
	<script async src="xmega65.js"></script>
</body>
</html>
